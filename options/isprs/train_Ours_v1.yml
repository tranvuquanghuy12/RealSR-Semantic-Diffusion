name: Ours_v1_ISPRS
use_tb_logger: true
model: ldm_v1
distortion: sr
scale: 4
gpu_ids: [0]
use_semantic_guidance: true
use_multitask: true
num_classes: 7
freq_loss_weight: 0.0          # V1 không có FFT Loss
# dino_model không cần thiết vì ldm_v1 dùng SimpleEncoder

datasets:
  train:
    name: ISPRS_train
    mode: SSSR
    aug: noise
    use_shuffle: true
    n_workers: 4
    SR:
      batch_size: 4
      supres_lst: ../datasets/kaggle_isprs/train_SR.lst
      degrade: [Bicubic]
      noise_data: Oracle
    SS:
      batch_size: 4
      semseg_lst: ../datasets/kaggle_isprs/train_SS.lst
    GT_size: 128
    use_flip: true
    use_rot: true
    color: RGB
    phase: train
    scale: 4
    data_type: img
  val:
    name: ISPRS_val
    mode: SSSR
    SR:
      supres_lst: ../datasets/kaggle_isprs/val_SR.lst
    SS:
      semseg_lst: ../datasets/kaggle_isprs/val_SS.lst
    use_shuffle: false
    n_workers: 4
    batch_size: 4
    GT_size: 128
    use_flip: false
    use_rot: false
    color: RGB
    phase: val
    scale: 4
    data_type: img

network_G:
  which_model_G: ldm_v1
  in_nc: 3
  out_nc: 3
  scale: 4

path:
  strict_load: false
  resume_state: ~           # Train từ đầu hoàn toàn

# 2000 samples / batch 4 = 500 iter/epoch → 30 epoch = 15000 iter
train:
  lr_G: !!float 1e-4
  weight_decay_G: 0
  beta1_G: 0.9
  beta2_G: 0.999
  lr_scheme: MultiStepLR
  niter: 15000
  warmup_iter: -1
  lr_steps: [5000, 10000]
  lr_gamma: 0.5
  manual_seed: 42
  val_freq: 3000

logger:
  print_freq: 100
  save_checkpoint_freq: 1500
